# 珙县抓拍 OCR → PI Demo（double-camera：两路摄像头并行抓拍）

# 两路摄像头各自独立配置（不再共用 type）
# type: mvs / gige / hikrobot = 海康机器人 GigE（MVS SDK）
# type: isapi = 监控机 HTTP ISAPI
# tag: 该路抓拍识别结果写 PI 时的测点前缀 → 前缀_1…_N
cameras:
  left:
    type: mvs
    host: "192.168.16.6"
    tag: "GX.DEMO.OCR.L"
    timeout_sec: 15
    # MVS：本机连接相机的网卡 IP（枚举匹配失败时按 IP 直连用）
    net_export: ""
    jpeg_quality: 80
  right:
    type: isapi
    host: "192.168.16.64"
    tag: "GX.DEMO.OCR.R"
    port: 80
    user: "admin"
    password: "Sdyw@192"
    channel: "101"
    timeout_sec: 15

capture:
  dir: "data/captures"
  # 联调页 Tab：single | dual | double（双摄两相机）
  mode: double
  # 定时：开启后立刻跑一轮，之后每隔 interval_minutes 再跑；上一轮未完则跳过
  # 落盘：data/captures/YYYYMMDD/H-MM_<left|right>.jpg
  schedule:
    enabled: false
    interval_minutes: 15
  # 各侧整图可先裁显示器有效区域再 OCR（四周有环境时建议开）
  auto_monitor: true
  # 仅 OCR 回退框（相对各摄像头整屏图）；日期优先自动定位「日期」标签
  dual:
    left:
      table_crop: "0.02,0.52,0.97,0.90"
      date_crop: "0.0,0.16,0.48,0.26"
    right:
      table_crop: "0.03,0.52,1.0,0.90"
      date_crop: "0.0,0.16,0.48,0.26"

ocr:
  workdir: "app/ocr_engine"
  scale: 2.0
  max_ocr_width: 4800
  min_confidence: 0.3
  min_points: 8
  # early_stop：表头可用且列≥4 即跳过后续；min_density 保留兼容（当前不参与判定）
  early_stop: true
  early_stop_min_density: 100
  parallel_sides: false
  onnx_threads: 2
  pi_date_back_days: 1
  date_auto_locate: true
  # 中间产物：single|dual|double / YYYYMMDD_HHMMSS_mmm/（双摄再下 left|right）
  artifacts_dir: "data/ocr_runs"
  fix_decimal:
    enabled: true
    ratio_k: 3.0
  sanitize:
    enabled: true
    min_samples: 4
    ratio_k: 3.0

excel:
  enabled: false
  dir: "data/exports"
  filename: "{stem}_{ts}.xlsx"

pi:
  # 测点前缀见 cameras.*.tag
  dll_dir: "app/pidll"
  dll_name: "piapi.dll"
  server: "192.168.2.230"
  user: "piadmin"
  password: "Hdpi-6018"
  curve_count: 96
  verify_write: true
  value_max: 1000

server:
  host: "127.0.0.1"
  port: 8088
