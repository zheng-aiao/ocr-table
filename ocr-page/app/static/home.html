<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>珙县 · 执行履历</title>
  <style>
    :root {
      --bg: #0e151c;
      --panel: #162028;
      --text: #e8eef4;
      --muted: #8a9aab;
      --line: #2a3846;
      --accent: #2f7fd1;
      --ok: #2fad6e;
      --err: #d45b63;
      --warn: #c9a227;
      --thumb: #0b1116;
      --page-max: min(1600px, calc(100vw - 32px));
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
    }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(900px 420px at 0% 0%, #1a2c3d 0%, transparent 55%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      width: var(--page-max);
      max-width: 100%;
      margin: 0 auto;
      padding: 14px 16px 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      align-items: flex-end;
      justify-content: space-between;
      flex-shrink: 0;
    }
    header h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.82rem;
    }
    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .nav a {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      color: var(--text);
      text-decoration: none;
      font-size: 0.84rem;
      background: var(--panel);
    }
    .nav a:hover { border-color: var(--accent); color: #fff; }
    .nav a.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    main {
      width: var(--page-max);
      max-width: 100%;
      margin: 0 auto;
      padding: 4px 16px 18px;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 4px 0 8px;
      align-items: center;
      flex-shrink: 0;
    }
    .filters label {
      color: var(--muted);
      font-size: 0.82rem;
    }
    select, input[type="date"], button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.84rem;
    }
    button {
      cursor: pointer;
      background: #1e2c38;
    }
    button:hover { border-color: var(--accent); }
    .meta {
      color: var(--muted);
      font-size: 0.8rem;
      margin-bottom: 8px;
      flex-shrink: 0;
    }
    .list {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-content: flex-start;
      gap: 8px;
      flex: 1;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 2px 2px 4px 0;
    }
    .row {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: center;
      gap: 14px;
      flex: 0 0 auto;
      width: 100%;
      min-width: 0;
      height: 80px;
      min-height: 72px;
      max-height: 88px;
      padding: 12px 16px;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      color: inherit;
      transition: border-color 0.15s ease;
    }
    .row:hover { border-color: var(--accent); }
    .row-main {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: center;
      gap: 14px;
      flex: 1 1 auto;
      min-width: 0;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }
    .info {
      flex: 1 1 auto;
      min-width: 0;
    }
    .row-actions {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-items: center;
      gap: 8px;
    }
    .btn-write-pi {
      padding: 5px 12px;
      border-radius: 8px;
      border: 1px solid rgba(47,127,209,0.55);
      background: rgba(47,127,209,0.18);
      color: #9ec5ef;
      font-size: 0.78rem;
      font-weight: 650;
      cursor: pointer;
      flex: 0 0 auto;
      white-space: nowrap;
    }
    .btn-write-pi:hover {
      border-color: var(--accent);
      background: rgba(47,127,209,0.32);
      color: #fff;
    }
    .btn-write-pi:disabled {
      opacity: 0.55;
      cursor: wait;
    }
    .thumb {
      width: 96px;
      height: 56px;
      flex: 0 0 auto;
      object-fit: cover;
      border-radius: 6px;
      background: var(--thumb);
      border: 1px solid var(--line);
    }
    .thumb.placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.72rem;
    }
    .info h3 {
      margin: 0 0 5px;
      font-size: 0.95rem;
      font-weight: 650;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .info .sub {
      color: var(--muted);
      font-size: 0.8rem;
      display: flex;
      flex-wrap: nowrap;
      gap: 4px 12px;
      line-height: 1.4;
      overflow: hidden;
    }
    .info .sub span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 650;
      white-space: nowrap;
    }
    .badge.ok { background: rgba(47,173,110,0.18); color: var(--ok); }
    .badge.fail { background: rgba(212,91,99,0.18); color: var(--err); }
    .badge.partial { background: rgba(201,162,39,0.18); color: var(--warn); }
    .badge.mode-single {
      background: rgba(47,127,209,0.16);
      color: #7eb6ef;
    }
    .badge.mode-dual {
      background: rgba(201,162,39,0.16);
      color: var(--warn);
    }
    .badges {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      gap: 6px;
      align-items: center;
      justify-content: flex-end;
      flex: 0 0 auto;
      width: max-content;
      max-width: none;
      white-space: nowrap;
    }
    .pager {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      align-items: center;
      justify-content: space-between;
      margin-top: 14px;
      padding: 14px 4px 6px;
      border-top: 1px solid var(--line);
      flex-shrink: 0;
      background: var(--bg);
    }
    .pager .pages {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .pager .size {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 0.82rem;
    }
    .pager button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .pager button:disabled:hover { border-color: var(--line); }
    .pager .page-info {
      color: var(--muted);
      font-size: 0.82rem;
      min-width: 7em;
      text-align: center;
    }
    button.accent {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    button.accent:hover { filter: brightness(1.06); }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    button:disabled:hover { border-color: var(--line); }
    .empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 36px 20px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 12px;
    }
    @media (max-width: 720px) {
      body { height: auto; min-height: 100vh; overflow: auto; }
      main { overflow: visible; padding-bottom: 24px; }
      .list { overflow: visible; flex: none; }
      .row {
        flex: 0 0 auto;
        height: 76px;
        min-height: 68px;
        max-height: 84px;
      }
      .thumb { width: 72px; height: 44px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>执行履历</h1>
      <p>每次抓拍 OCR / 入 PI 的记录。点开可看源图、识别结果与过程图。</p>
    </div>
    <nav class="nav">
      <a class="primary" href="/debug">联调</a>
      <a href="/pi-correct">纠正PI值</a>
    </nav>
  </header>
  <main>
    <div class="filters">
      <label>结果
        <select id="result">
          <option value="">全部</option>
          <option value="any_ok" selected>任一成功</option>
          <option value="ok">两侧都成功</option>
          <option value="partial_ok">部分成功</option>
          <option value="capture_fail">抓拍失败</option>
          <option value="ocr_fail">OCR识别失败</option>
          <option value="pi_fail">写PI失败</option>
          <option value="pending_pi">待写PI</option>
        </select>
      </label>
      <label>日期 <input type="date" id="day" /></label>
      <button type="button" id="reload">刷新</button>
      <button type="button" class="accent" id="rewritePi" title="按当前筛选批量补写所有「待写PI / 写PI失败」">重写 PI</button>
    </div>
    <div class="meta" id="meta">加载中…</div>
    <div class="list" id="list"></div>
    <div class="pager" id="pager">
      <div class="pages">
        <button type="button" id="prevPage">上一页</button>
        <span class="page-info" id="pageInfo">—</span>
        <button type="button" id="nextPage">下一页</button>
      </div>
      <label class="size">每页
        <select id="pageSize">
          <option value="12" selected>12</option>
          <option value="20">20</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
      </label>
    </div>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    let page = 1;
    let totalPages = 1;

    function todayISO() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function modeBadge(item) {
      return item.mode === 'dual'
        ? ['mode-dual', '双屏']
        : ['mode-single', '单屏'];
    }

    function statusBadge(item) {
      const st = item.result_status || '';
      if (st === 'ok') {
        return item.mode === 'dual' ? ['ok', '两侧都成功'] : ['ok', '成功'];
      }
      if (st === 'partial_ok') return ['partial', '部分成功'];
      if (st === 'capture_fail') return ['fail', '抓拍失败'];
      if (st === 'ocr_fail') return ['fail', 'OCR识别失败'];
      if (st === 'pi_fail') return ['fail', '写PI失败'];
      if (st === 'pending_pi') return ['partial', '待写PI'];
      // 兼容旧数据
      if (item.mode === 'dual') {
        const l = item.left_ok, r = item.right_ok;
        if (l && r && item.pi_status === 'ok') return ['ok', '成功'];
        if ((l && !r) || (!l && r)) {
          if (item.pi_status === 'ok') return ['partial', '部分成功'];
          if (item.pi_status === 'fail') return ['fail', '写PI失败'];
          return ['partial', '待写PI'];
        }
        return ['fail', 'OCR识别失败'];
      }
      return item.ok ? ['ok', '成功'] : ['fail', '失败'];
    }

    function triggerLabel(t) {
      return ({ schedule: '定时', manual: '手动', debug: '联调' })[t] || (t || '-');
    }

    function pointsText(item) {
      if (item.mode === 'dual') {
        const lA = item.point_count_left ?? '-';
        const lR = item.ocr_filled_left ?? '-';
        const lE = item.expected_cells_left ?? '-';
        const rA = item.point_count_right ?? '-';
        const rR = item.ocr_filled_right ?? '-';
        const rE = item.expected_cells_right ?? '-';
        return `左 ${lA}/${lR} 预计${lE} · 右 ${rA}/${rR} 预计${rE}`;
      }
      const adopted = item.point_count ?? 0;
      const recog = item.ocr_filled ?? '-';
      const expected = item.expected_cells ?? '-';
      return `采纳/识别 ${adopted}/${recog} · 预计 ${expected}`;
    }

    function fmtMs(ms) {
      if (ms == null || ms === '') return '';
      const n = Number(ms);
      if (!Number.isFinite(n)) return '';
      if (n < 1000) return Math.round(n) + 'ms';
      return (n / 1000).toFixed(1) + 's';
    }

    function timingText(item) {
      const ocr = fmtMs(item.ocr_ms);
      const total = fmtMs(item.total_ms);
      if (!ocr && !total) return '';
      if (ocr && total) return `OCR ${ocr} / 总 ${total}`;
      if (ocr) return `OCR ${ocr}`;
      return `总 ${total}`;
    }

    function pageSize() {
      const n = Number($('pageSize').value) || 12;
      return Math.min(200, Math.max(1, n));
    }

    function currentFilters() {
      return {
        result: $('result').value,
        day: $('day').value,
      };
    }

    function updatePager(total) {
      const limit = pageSize();
      totalPages = Math.max(1, Math.ceil((total || 0) / limit));
      if (page > totalPages) page = totalPages;
      const from = total === 0 ? 0 : (page - 1) * limit + 1;
      const to = Math.min(page * limit, total);
      $('meta').textContent = total
        ? `第 ${from}–${to} 条，共 ${total} 条`
        : '共 0 条';
      $('pageInfo').textContent = `第 ${page} / ${totalPages} 页`;
      $('prevPage').disabled = page <= 1 || total === 0;
      $('nextPage').disabled = page >= totalPages || total === 0;
    }

    async function load() {
      const { result, day } = currentFilters();
      const limit = pageSize();
      const offset = (page - 1) * limit;
      const qs = new URLSearchParams({
        limit: String(limit),
        offset: String(offset),
      });
      if (result) qs.set('result', result);
      if (day) qs.set('day', day);
      $('meta').textContent = '加载中…';
      $('list').innerHTML = '';
      try {
        const resp = await fetch('/api/runs?' + qs.toString());
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.detail || '加载失败');
        const total = Number(data.total) || 0;
        updatePager(total);
        if (!data.items.length) {
          $('list').innerHTML = '<div class="empty">暂无执行记录。可先去「联调」跑一轮，或开启定时。</div>';
          return;
        }
        const frag = document.createDocumentFragment();
        for (const item of data.items) {
          const [cls, label] = statusBadge(item);
          const [modeCls, modeLabel] = modeBadge(item);
          const row = document.createElement('div');
          row.className = 'row';
          const thumbUrl = item.source_url || item.capture_url || '';
          const canWritePi = !!item.pi_pending;
          const detailHref = '/runs/' + encodeURIComponent(item.id);
          row.innerHTML = `
            <a class="row-main" href="${detailHref}">
              ${thumbUrl
                ? `<img class="thumb" src="${thumbUrl}" alt="" loading="lazy" />`
                : `<div class="thumb placeholder">无图</div>`}
              <div class="info">
                <h3>${item.finished_at || item.started_at || item.id}</h3>
                <div class="sub">
                  <span>${triggerLabel(item.trigger)}</span>
                  ${(() => {
                    const name = (item.display_name || item.upload_name || '').trim();
                    if (name) {
                      const t = String(name).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
                      return '<span title="' + t + '">文件：' + t + '</span>';
                    }
                    const p = item.source_path || item.capture_path || '';
                    const base = p ? String(p).replace(/\\\\/g,'/').split('/').pop() : '';
                    if (base && !/^00_source\\./i.test(base)) {
                      const t = String(base).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
                      return '<span title="' + t + '">文件：' + t + '</span>';
                    }
                    return '';
                  })()}
                  <span>${pointsText(item)}</span>
                  ${timingText(item) ? `<span>${timingText(item)}</span>` : ''}
                  ${item.message ? `<span title="${String(item.message).replace(/"/g, '&quot;')}">${item.message}</span>` : (item.reason ? `<span>${item.reason}</span>` : '')}
                </div>
              </div>
            </a>
            <div class="badges">
              <span class="badge ${modeCls}">${modeLabel}</span>
              <span class="badge ${cls}">${label}</span>
              ${canWritePi
                ? `<button type="button" class="btn-write-pi" data-run-id="${String(item.id).replace(/"/g, '&quot;')}" title="仅将本条 OCR 结果写入 PI（区别于顶部批量重写）">写 PI</button>`
                : ''}
            </div>
          `;
          frag.appendChild(row);
        }
        $('list').appendChild(frag);
        $('list').querySelectorAll('.btn-write-pi').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            writeOnePi(btn);
          });
        });
      } catch (e) {
        $('meta').textContent = '加载失败';
        $('list').innerHTML = `<div class="empty">${e.message || e}</div>`;
      }
    }

    async function writeOnePi(btn) {
      const runId = btn.getAttribute('data-run-id') || '';
      if (!runId) return;
      if (!confirm(`将本条执行结果写入 PI？\n${runId}`)) return;
      const oldText = btn.textContent;
      btn.disabled = true;
      btn.textContent = '写入中…';
      try {
        const resp = await fetch('/api/runs/' + encodeURIComponent(runId) + '/pi/rewrite', {
          method: 'POST',
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) throw new Error(data.detail || data.message || '写 PI 失败');
        if (!data.ok) {
          throw new Error(data.message || data.reason || '写 PI 未成功');
        }
        const written = data.pi?.written ?? data.written;
        const total = data.pi?.total ?? data.total;
        alert(
          written != null && total != null
            ? `写 PI 成功：${written}/${total}`
            : '写 PI 成功'
        );
        await load();
      } catch (e) {
        alert(e.message || e);
        btn.disabled = false;
        btn.textContent = oldText;
      }
    }

    function reloadFromFirst() {
      page = 1;
      load();
    }

    async function rewritePi() {
      const { day } = currentFilters();
      const countQs = new URLSearchParams({ limit: '1', offset: '0', pi: 'pending' });
      if (day) countQs.set('day', day);
      let pending = 0;
      try {
        const countResp = await fetch('/api/runs?' + countQs.toString());
        const countData = await countResp.json();
        if (!countResp.ok) throw new Error(countData.detail || '查询待补录失败');
        pending = Number(countData.total) || 0;
      } catch (e) {
        alert(e.message || e);
        return;
      }
      if (!pending) {
        alert('当前筛选下没有可补录记录（OCR 成功且写 PI 为「未写入/写失败」）。');
        return;
      }
      const scope = day || '全部';
      if (!confirm(`将对「${scope}」下 ${pending} 条按时间线补写 PI（未写入+写失败），是否继续？`)) return;

      const btn = $('rewritePi');
      btn.disabled = true;
      const oldText = btn.textContent;
      btn.textContent = '补录中…';
      $('meta').textContent = `正在补录 ${pending} 条…`;
      try {
        const body = { limit: Math.min(500, pending) };
        if (day) body.day = day;
        const resp = await fetch('/api/runs/pi/rewrite', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.detail || '补录失败');
        const msg = `补录完成：成功 ${data.success || 0}，失败 ${data.failed || 0}，合计 ${data.total || 0}`;
        alert(msg);
        await load();
      } catch (e) {
        alert(e.message || e);
        await load();
      } finally {
        btn.disabled = false;
        btn.textContent = oldText;
      }
    }

    $('reload').addEventListener('click', load);
    $('rewritePi').addEventListener('click', rewritePi);
    $('result').addEventListener('change', reloadFromFirst);
    $('day').addEventListener('change', reloadFromFirst);
    $('pageSize').addEventListener('change', reloadFromFirst);
    $('prevPage').addEventListener('click', () => {
      if (page <= 1) return;
      page -= 1;
      load();
    });
    $('nextPage').addEventListener('click', () => {
      if (page >= totalPages) return;
      page += 1;
      load();
    });
    // 默认查今日（清空日期可查全部）
    if (!$('day').value) $('day').value = todayISO();
    load();
  </script>
</body>
</html>
