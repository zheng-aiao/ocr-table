<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>现货曲线 Demo · 三指标</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <style>
    :root {
      --bg: #eef3f8;
      --panel: #ffffff;
      --text: #1f2a37;
      --muted: #6b7c93;
      --line: #d7e0ea;
      --accent: #2f6fed;
      --ok: #1a7f4b;
      --err: #c62828;
      /* 表头近白浅灰、数据行更浅的蓝 */
      --table-header: #f2f3f5;
      --table-row: #d6e6f2;
      --table-border: #c5ced9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(180deg, #f5f8fc 0%, var(--bg) 40%);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      padding: 20px 28px 12px;
    }
    header h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
    }
    header p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .toolbar label {
      font-size: 0.82rem;
      color: var(--muted);
      margin-right: 4px;
    }
    .toolbar input[type="date"] {
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }
    button {
      border: 0;
      border-radius: 8px;
      padding: 9px 14px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--line);
    }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    a.link {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
    }
    main {
      padding: 0 28px 28px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(31, 42, 55, 0.04);
      padding: 14px 16px 16px;
    }
    .panel-title {
      margin: 0 0 10px;
      font-size: 0.95rem;
      font-weight: 700;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 8px;
    }
    #chart {
      width: 100%;
      height: 340px;
    }
    .table-wrap {
      overflow: auto;
      max-height: 360px;
      border: 1px solid var(--table-border);
      border-radius: 8px;
      -webkit-overflow-scrolling: touch;
    }
    table {
      border-collapse: collapse;
      width: max-content;
      min-width: 100%;
      font-size: 12px;
    }
    th, td {
      border: 1px solid var(--table-border);
      padding: 8px 10px;
      white-space: nowrap;
      text-align: center;
      vertical-align: middle;
      color: var(--text);
    }
    th:first-child, td:first-child {
      position: sticky;
      left: 0;
      z-index: 1;
      font-weight: 650;
    }
    thead th {
      position: sticky;
      top: 0;
      background: var(--table-header);
      z-index: 2;
      font-weight: 600;
      color: var(--text);
    }
    thead th:first-child {
      z-index: 3;
      background: var(--table-header);
    }
    tbody td {
      background: var(--table-row);
    }
    tbody td:first-child {
      background: var(--table-row);
    }
    .status {
      min-height: 1.2em;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--err); }
    pre {
      margin: 0;
      max-height: 420px;
      overflow: auto;
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-all;
      color: #334155;
      background: #f7fafc;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>现货 · 曲线 / 表格 Demo</h1>
      <p>仿现场屏幕：上折线、下三指标表（测试对照）。「一键全流程」结果单独展示，不覆盖对照表。</p>
    </div>
    <div class="toolbar">
      <label for="bizDate">业务日期</label>
      <input id="bizDate" type="date" />
      <button id="btnRun">一键全流程</button>
      <button class="secondary" id="btnCapture">抓图</button>
      <button class="secondary" id="btnNextData">换一批测试数据</button>
      <a class="link" href="/">履历首页</a>
      <a class="link" href="/debug">联调</a>
    </div>
  </header>

  <main>
    <section class="panel">
      <div class="panel-title">曲线（三指标）</div>
      <div class="meta">
        <span id="dataName">数据集：—</span>
        <span id="headerHint">表头：全天 00:15 ~ 24:00（15 分钟）</span>
        <span>表样式：表头浅灰 / 数据行浅蓝</span>
      </div>
      <div id="chart"></div>
    </section>

    <section class="panel">
      <div class="panel-title">表格数据（对照基准，不随全流程覆盖）</div>
      <div class="table-wrap">
        <table>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel">
      <div class="panel-title">一键全流程结果</div>
      <div class="meta">
        <span>抓图 → OCR → 写 PI / Excel；下方 JSON 便于与上表对照</span>
      </div>
      <div id="status" class="status"></div>
      <pre id="log">尚未执行。点「一键全流程」后，接口返回的 JSON 会显示在这里；上方曲线/表格保持不变。</pre>
    </section>
  </main>

  <script>
    const LABELS = ["GX.DEMO.OCR_1", "GX.DEMO.OCR_2", "GX.DEMO.OCR_3"];
    const COLORS = ["#94a3b8", "#38bdf8", "#2f6fed"];

    function pad(n) { return String(n).padStart(2, "0"); }

    function fullDayHeaders() {
      const headers = [];
      for (let i = 1; i <= 96; i++) {
        const mins = i * 15;
        const hh = Math.floor(mins / 60);
        const mm = mins % 60;
        if (hh === 24) headers.push("24:00");
        else headers.push(`${pad(hh)}:${pad(mm)}`);
      }
      return headers;
    }

    function series(seed, base, amp, wave) {
      const out = [];
      for (let i = 0; i < 96; i++) {
        const t = i / 96;
        const v = base
          + amp * Math.sin((t + seed) * Math.PI * wave)
          + (i % 7 === 0 ? amp * 0.15 : 0);
        out.push(Math.round(v * 1000) / 1000);
      }
      return out;
    }

    const DEFAULT_HEADERS = fullDayHeaders();

    const DATASETS = [
      {
        name: "示例 A · 平稳波动",
        headers: DEFAULT_HEADERS,
        rows: [
          series(0.1, 0, 0, 1).map(() => 0),
          series(0.2, 0, 0, 1).map(() => 0),
          series(0.05, 380, 45, 4),
        ],
      },
      {
        name: "示例 B · 晚高峰抬升",
        headers: DEFAULT_HEADERS,
        rows: [
          series(0.0, 10, 8, 2),
          series(0.3, 5, 4, 3),
          DEFAULT_HEADERS.map((_, i) => {
            const h = i / 4;
            const peak = h >= 18 && h <= 22 ? 80 : 0;
            return Math.round((320 + peak + 20 * Math.sin(i / 5)) * 1000) / 1000;
          }),
        ],
      },
      {
        name: "示例 C · 对照样本风格",
        headers: DEFAULT_HEADERS,
        rows: [
          series(0.0, 0, 0, 1).map(() => 0),
          series(0.0, 0, 0, 1).map(() => 0),
          DEFAULT_HEADERS.map((_, i) => {
            const sample = [362.381,400,367.824,393.393,394.069,400,400,477.92,470.84,400,395,395,400,400,410,391.947,477.92,410,390,410,395,393,380,387];
            const idx = DEFAULT_HEADERS.indexOf("18:15");
            if (i >= idx && i - idx < sample.length) return sample[i - idx];
            return Math.round((350 + 15 * Math.sin(i / 6)) * 1000) / 1000;
          }),
        ],
      },
    ];

    let dataIndex = 0;
    const chart = echarts.init(document.getElementById("chart"));
    const statusEl = document.getElementById("status");
    const logEl = document.getElementById("log");
    const btnRun = document.getElementById("btnRun");
    const btnCapture = document.getElementById("btnCapture");
    const btnNext = document.getElementById("btnNextData");

    function setStatus(text, ok) {
      statusEl.textContent = text;
      statusEl.className = "status " + (ok === true ? "ok" : ok === false ? "err" : "");
    }
    function showLog(obj) {
      logEl.textContent = typeof obj === "string" ? obj : JSON.stringify(obj, null, 2);
    }
    function setBusy(busy) {
      btnRun.disabled = busy;
      btnCapture.disabled = busy;
      btnNext.disabled = busy;
    }

    function current() {
      return DATASETS[dataIndex];
    }

    function renderChart(ds) {
      const headers = ds.headers;
      chart.setOption({
        color: COLORS,
        tooltip: { trigger: "axis" },
        legend: { data: LABELS, top: 0 },
        grid: { left: 48, right: 24, top: 40, bottom: 56 },
        xAxis: {
          type: "category",
          data: headers,
          axisLabel: { rotate: 45, fontSize: 10, interval: Math.max(1, Math.floor(headers.length / 24)) },
          axisLine: { lineStyle: { color: "#c5d0de" } },
        },
        yAxis: {
          type: "value",
          splitLine: { lineStyle: { color: "#e8eef5" } },
        },
        series: LABELS.map((name, i) => ({
          name,
          type: "line",
          smooth: true,
          showSymbol: false,
          connectNulls: false,
          lineStyle: { width: i === 2 ? 2.5 : 1.5 },
          data: ds.rows[i],
        })),
      }, true);
    }

    function renderTable(ds) {
      const headers = ds.headers;
      const thead = document.getElementById("thead");
      const tbody = document.getElementById("tbody");
      thead.innerHTML = "<tr><th>指标</th>" + headers.map(h => `<th>${h}</th>`).join("") + "</tr>";
      tbody.innerHTML = LABELS.map((name, i) => {
        const cells = ds.rows[i].map(v => `<td>${v == null ? "" : v}</td>`).join("");
        return `<tr><td>${name}</td>${cells}</tr>`;
      }).join("");
    }

    function renderAll() {
      const ds = current();
      document.getElementById("headerHint").textContent =
        `表头：全天 00:15 ~ 24:00（${ds.headers.length} 点）`;
      document.getElementById("dataName").textContent =
        `数据集：${ds.name}（${dataIndex + 1}/${DATASETS.length}）`;
      renderChart(ds);
      renderTable(ds);
    }

    async function call(url, options) {
      setBusy(true);
      setStatus("请求中…");
      try {
        const resp = await fetch(url, options);
        const data = await resp.json().catch(() => ({ detail: resp.statusText }));
        if (!resp.ok) {
          setStatus(data.detail || ("HTTP " + resp.status), false);
          showLog(data);
          return null;
        }
        setStatus(data.ok ? "全流程完成" : "全流程结束（有失败项，见 JSON）", !!data.ok);
        showLog(data);
        return data;
      } catch (e) {
        setStatus(String(e), false);
        showLog(String(e));
        return null;
      } finally {
        setBusy(false);
      }
    }

    document.getElementById("btnNextData").onclick = () => {
      dataIndex = (dataIndex + 1) % DATASETS.length;
      renderAll();
      setStatus(`已切换对照数据：${DATASETS[dataIndex].name}`, true);
    };

    document.getElementById("btnCapture").onclick = async () => {
      setBusy(true);
      setStatus("抓图中…");
      try {
        const resp = await fetch("/api/capture", { method: "POST" });
        const data = await resp.json().catch(() => ({ detail: resp.statusText }));
        if (!resp.ok) {
          setStatus(data.detail || ("HTTP " + resp.status), false);
          showLog(data);
          return;
        }
        setStatus("抓图成功（仅存盘，未跑 OCR/PI）", true);
        showLog(data);
      } catch (e) {
        setStatus(String(e), false);
        showLog(String(e));
      } finally {
        setBusy(false);
      }
    };

    document.getElementById("btnRun").onclick = async () => {
      const base_date = document.getElementById("bizDate").value || null;
      // 仅刷新下方结果卡片，不改动上方曲线/表格对照基准
      await call("/api/run", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ base_date }),
      });
    };

    document.getElementById("bizDate").value = new Date().toISOString().slice(0, 10);
    renderAll();
    window.addEventListener("resize", () => chart.resize());
  </script>
</body>
</html>
